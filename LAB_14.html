
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Technology Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #102a2e;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quiz-container {
            background: #f8fafc;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000018;
        }

        h1 {
            text-align: center;
            color: #0f766e;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        .progress {
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: #0f766e;
            transition: width 0.3s;
        }

        #questionNumber {
            color: #0f766e;
            font-weight: bold;
        }

        #question {
            font-size: 20px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .option {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            color: #222;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .option:hover:not(:disabled) {
            border-color: #6366f1;
            background: #102a2e;
            color: white;
        }

        .option.correct {
            background: #d1fae5;
            border-color: #059669;
            color: #065f46;
        }

        .option.wrong {
            background: #ffe4e6;
            border-color: #e11d48;
            color: #9f1239;
        }

        .option:disabled {
            cursor: default;
        }

        #feedback {
            min-height: 24px;
            font-weight: bold;
            margin-top: 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .main-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0f766e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .main-btn:hover:not(:disabled) {
            background: #115e59;
        }

        .main-btn:disabled {
            background: #99f6e4;
            color: #334155;
            cursor: not-allowed;
        }

        #result {
            display: none;
            text-align: center;
        }

        #finalScore {
            font-size: 28px;
            color: #0f766e;
            font-weight: bold;
        }

        #message {
            color: #555;
            margin-bottom: 25px;
        }

        @media (max-width: 480px) {
            .quiz-container {
                padding: 20px;
            }

            #question {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <div id="quiz">
        <h1>Web Technology Quiz</h1>
        <p class="subtitle">First-Year Engineering Practice</p>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <p id="questionNumber"></p>
        <h2 id="question"></h2>

        <div id="options"></div>

        <p id="feedback" aria-live="polite"></p>

        <div class="buttons">
            <button
                class="main-btn"
                id="nextBtn"
                onclick="nextQuestion()"
                disabled
            >
                Next Question
            </button>
        </div>
    </div>

    <div id="result">
        <h1>Quiz Completed!</h1>
        <p>Your final score is:</p>
        <p id="finalScore"></p>
        <h2 id="percentage"></h2>
        <p id="message"></p>

        <button class="main-btn" onclick="restartQuiz()">
            Restart Quiz
        </button>
    </div>

</div>

<script>
    const questions = [
        {
            question: "1. Which HTML element is used to create a table row?",
            options: ["<td>", "<tr>", "<th>", "<table-row>"],
            answer: 1
        },
        {
            question: "2. Which attribute provides alternative text for an image?",
            options: ["title", "src", "alt", "href"],
            answer: 2
        },
        {
            question: "3. Which CSS property adds space inside an element's border?",
            options: ["margin", "padding", "spacing", "outline"],
            answer: 1
        },
        {
            question: '4. Which CSS selector targets elements with class="card"?',
            options: ["#card", "card", ".card", "*card"],
            answer: 2
        },
        {
            question: "5. Which HTML element is used to collect user input?",
            options: ["<form>", "<inputbox>", "<data>", "<fieldset-only>"],
            answer: 0
        },
        {
            question: "6. Which JavaScript keyword declares a block-scoped variable that can be reassigned?",
            options: ["const", "let", "static", "define"],
            answer: 1
        },
        {
            question: '7. Which HTML attribute opens a link in a new tab when set to "_blank"?',
            options: ["target", "rel", "open", "window"],
            answer: 0
        },
        {
            question: "8. Which CSS layout system is designed for arranging items in rows or columns?",
            options: ["Float only", "Grid only", "Flexbox", "Font layout"],
            answer: 2
        },
        {
            question: "9. Which JavaScript method selects an element by its ID?",
            options: [
                "getElementByClass()",
                "queryID()",
                "getElementById()",
                "selectById()"
            ],
            answer: 2
        },
        {
            question: "10. Which HTML element is used to play video in a web page?",
            options: ["<media>", "<movie>", "<video>", "<play>"],
            answer: 2
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionNumber = document.getElementById("questionNumber");
    const questionElement = document.getElementById("question");
    const optionsElement = document.getElementById("options");
    const feedbackElement = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const progressBar = document.getElementById("progressBar");

    function loadQuestion() {
        answered = false;

        const q = questions[currentQuestion];

        questionNumber.textContent =
            `Question ${currentQuestion + 1} of ${questions.length}`;

        questionElement.textContent = q.question;
        optionsElement.innerHTML = "";
        feedbackElement.textContent = "";

        nextBtn.disabled = true;

        nextBtn.textContent =
            currentQuestion === questions.length - 1
                ? "Show Result"
                : "Next Question";

        progressBar.style.width =
            (currentQuestion / questions.length * 100) + "%";

        q.options.forEach((option, index) => {
            const button = document.createElement("button");

            button.type = "button";
            button.className = "option";
            button.textContent =
                String.fromCharCode(65 + index) + ". " + option;

            button.onclick = () => checkAnswer(index, button);

            optionsElement.appendChild(button);
        });
    }

    function checkAnswer(selectedIndex, selectedButton) {
        if (answered) return;

        answered = true;

        const correctIndex = questions[currentQuestion].answer;
        const allOptions =
            optionsElement.querySelectorAll(".option");

        allOptions.forEach((button, index) => {
            button.disabled = true;

            if (index === correctIndex) {
                button.classList.add("correct");
            }
        });

        if (selectedIndex === correctIndex) {
            score++;

            feedbackElement.textContent = "Correct! Well done.";
            feedbackElement.style.color = "#15803d";
        } else {
            selectedButton.classList.add("wrong");

            feedbackElement.textContent =
                "Incorrect. The correct answer is " +
                questions[currentQuestion].options[correctIndex] + ".";

            feedbackElement.style.color = "#dc2626";
        }

        nextBtn.disabled = false;
    }

    function nextQuestion() {
        if (!answered) return;

        currentQuestion++;

        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz").style.display = "none";
        document.getElementById("result").style.display = "block";

        const total = questions.length;
        const percent = Math.round((score / total) * 100);

        document.getElementById("finalScore").textContent =
            `${score} / ${total}`;

        document.getElementById("percentage").textContent =
            `${percent}%`;

        let message;

        if (percent >= 80) {
            message =
                "Excellent! You have a strong understanding of Web Technology.";
        } else if (percent >= 50) {
            message =
                "Good effort! Keep practising to improve your score.";
        } else {
            message =
                "Keep learning! Review the basics and try again.";
        }

        document.getElementById("message").textContent = message;
        progressBar.style.width = "100%";
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        answered = false;

        document.getElementById("result").style.display = "none";
        document.getElementById("quiz").style.display = "block";

        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
